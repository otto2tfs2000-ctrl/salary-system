<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Otto2 ARTCLUB 線上預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --navy:#1E2B4F; --gold:#E3B34C; --paper:#F7F5F0; --card:#FFF;
  --ink:#2A2E38; --ink-soft:#6B7180; --line:#E4E1D9; --sel:#EEF1FA;
  --ok:#2E7D4F; --warn:#C0392B;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--paper);color:var(--ink);padding-bottom:110px}
.hero{background:var(--navy);color:#fff;padding:20px 20px 14px;position:relative}
.hero .brand{display:flex;align-items:center;gap:10px}
.hero .star{color:var(--gold);font-size:18px}
.hero h1{font-size:19px;font-weight:900;letter-spacing:.5px}
.steps{display:flex;gap:6px;margin-top:14px}
.steps i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.22);font-style:normal}
.steps i.on{background:var(--gold)}
.stepname{font-size:12.5px;opacity:.8;margin-top:8px}
.tabs{position:sticky;top:0;z-index:20;background:var(--paper);display:flex;gap:4px;overflow-x:auto;padding:12px 14px 0;border-bottom:1.5px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 14px 11px;font-size:14.5px;font-weight:500;color:var(--ink-soft);border:none;background:none;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);font-weight:700;border-bottom-color:var(--gold)}
.list{padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;position:relative;transition:.15s}
.card.sel{border-color:var(--navy);background:var(--sel)}
.card .pic{flex:0 0 76px;height:76px;border-radius:10px;background:var(--navy) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:22px}
.card .body{flex:1;min-width:0}
.card h3{font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.35;padding-right:20px}
.card .desc{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--paper);border:1px solid var(--line)}
.chip.price{font-weight:700;color:var(--navy);border-color:#CFD6E8}
.tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.card.sel .tick{background:var(--navy);border-color:var(--navy)}
.vars,.addons{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed #C9CFDF}
.card.sel .vars,.card.sel .addons{display:block}
.vtitle{font-size:12.5px;color:var(--ink-soft);margin-bottom:7px}
.vrow{display:flex;gap:8px;flex-wrap:wrap}
.vopt{padding:7px 13px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-family:inherit}
.vopt.on{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:700}
.vopt.blocked{opacity:.45;background:var(--paper)}
.vnote{font-size:11.5px;color:#8A6400;background:#FDF7E8;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.6}
.aopt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-family:inherit;margin-bottom:7px;text-align:left}
.aopt .ap{color:var(--ink-soft);font-size:12.5px;flex:0 0 auto;margin-left:8px}
.aopt.on{border-color:var(--navy);background:var(--sel)}
.aopt.on .abox{background:var(--navy);border-color:var(--navy)}
.abox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;margin-right:9px;flex:0 0 auto}
.aopt .aname{flex:1;display:flex;align-items:center}
.qty{display:none;margin-top:11px;align-items:center;gap:12px}
.card.sel .qty{display:flex}
.qty span{font-size:13px;color:var(--ink-soft)}
.sess{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed #C9CFDF}
.card.sel .sess{display:block}
.sess>span{font-size:13px;color:var(--ink-soft);display:block;margin-bottom:7px}
.srow{display:flex;gap:8px}
.sopt{flex:1;padding:9px 6px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--navy);font-family:inherit}
.sopt small{display:block;font-size:10.5px;font-weight:400;color:var(--ink-soft);margin-top:2px}
.sopt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sopt.on small{color:rgba(255,255,255,.75)}
.longnote{display:none;margin-top:10px;background:#EEF1FA;border-radius:9px;padding:9px 11px;font-size:11.5px;color:var(--navy);line-height:1.6}
.card.sel .longnote{display:block}
.stepper{display:flex;border:1.5px solid var(--navy);border-radius:9px;overflow:hidden}
.stepper button{width:34px;height:32px;border:none;background:#fff;font-size:18px;color:var(--navy);font-weight:700}
.stepper b{width:36px;text-align:center;font-size:15px;background:#fff;line-height:32px}
.state{padding:48px 24px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.7}
/* 第一次開的載入骨架 */
.sk-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(16,24,40,.05)}
.sk-line{height:12px;border-radius:6px;margin-bottom:9px;
  background:linear-gradient(90deg,#EFEFEC 25%,#F7F7F5 50%,#EFEFEC 75%);
  background-size:200% 100%;animation:skshine 1.3s ease-in-out infinite}
.sk-line:last-child{margin-bottom:0}
.sk-line.w90{width:90%}.sk-line.w60{width:60%}.sk-line.w40{width:40%}
@keyframes skshine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.calwrap{padding:16px 14px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead h2{font-size:17px;color:var(--navy)}
.calhead button{border:1.5px solid var(--line);background:#fff;border-radius:9px;width:36px;height:34px;font-size:16px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid .wd{text-align:center;font-size:12px;color:var(--ink-soft);padding:6px 0}
.day{aspect-ratio:1;border-radius:10px;border:1.5px solid transparent;background:none;font-size:14.5px;font-family:inherit;color:var(--ink)}
.day.off{color:#C5C8D0}
.day.avail{background:#fff;border-color:var(--line)}
.day.on{background:var(--navy);color:#fff;font-weight:700}
.slots{margin-top:16px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px}
.slots h3{font-size:14px;color:var(--navy);margin-bottom:11px}
.slotrow{display:flex;flex-direction:column;gap:9px}
.slot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-family:inherit;font-size:15px}
.slot .left{font-weight:700;color:var(--navy)}
.slot .cap{font-size:12.5px;color:var(--ok)}
.slot .cap.low{color:var(--warn)}
.slot.on{border-color:var(--navy);background:var(--sel)}
.slot:disabled{opacity:.45}
.form{padding:16px 14px;display:flex;flex-direction:column;gap:13px}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;background:#fff}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--navy)}
.recap{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.8}
.recap b{color:var(--navy)}
.dep{display:flex;flex-direction:column;gap:9px}
.partypage{padding:26px 18px 10px}
.pgtitle{font-size:21px;font-weight:900;color:var(--navy);margin-bottom:8px}
.pgsub{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:20px}
.kidage{margin-top:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px}
.agebox select{margin-left:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);min-width:118px}
.katitle{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
.karow{display:flex;flex-wrap:wrap;gap:10px}
.kanote{font-size:11.5px;color:var(--ink-soft);margin-top:11px;line-height:1.6}
.totalbar{margin-top:16px;text-align:center;font-size:14px;color:var(--ink-soft)}
.totalbar b{color:var(--navy);font-size:16px}
.keynotes{margin-top:18px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px}
.kn{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-soft);line-height:1.65}
.kn+.kn{margin-top:9px;padding-top:9px;border-top:1px solid var(--paper)}
.kn b{color:var(--navy)}
.ki{flex:0 0 18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.notes{margin-top:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.notes summary{padding:14px 16px;font-size:13.5px;color:var(--navy);font-weight:700;cursor:pointer;list-style:none;position:relative}
.notes summary::-webkit-details-marker{display:none}
.notes summary::after{content:"＋";position:absolute;right:16px;top:13px;font-size:16px;color:var(--ink-soft)}
.notes[open] summary::after{content:"−"}
.notes[open] summary{border-bottom:1px solid var(--line)}
.ncontent{padding:14px 16px 16px;font-size:12.5px;color:var(--ink-soft);line-height:1.85}
.nsec+.nsec{margin-top:14px}
.nsec h4{font-size:13px;color:var(--navy);font-weight:700;margin-bottom:4px}
.nsec p{font-size:12.5px;color:var(--ink-soft);line-height:1.85;margin:0}
.ncontent b,.ncontent strong{display:inline!important;font-size:inherit!important;color:var(--navy);margin:0!important}
.nsec h4{display:block}
.needwrap{padding:12px 14px 0}
.partywrap{padding:14px 14px 0}
.pbox{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 14px}
.ptitle{font-size:13px;color:var(--ink-soft);margin:0 0 8px 2px}
.prow2{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.prow2+.prow2{border-top:1px solid var(--line)}
.plabel b{display:block;font-size:15px;color:var(--ink);font-weight:500}
.plabel small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.pstep{display:flex;align-items:center;gap:14px}
.pbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-size:19px;font-weight:700;font-family:inherit;line-height:1;display:flex;align-items:center;justify-content:center}
.pbtn:disabled{border-color:#DDD;color:#CCC}
.pnum{min-width:22px;text-align:center;font-size:16px;font-weight:700;color:var(--ink)}
.agebox{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}
.agebox input{width:56px;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;text-align:center;background:#fff}
.agebox input:focus{outline:none;border-color:var(--navy)}
.card.locked{opacity:.5}
.agetag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#FDF3DC;color:#8A6400;margin-left:6px;vertical-align:2px}
.agewarn{margin-top:9px;background:#FDF7E8;border:1.5px solid #E8D9A8;border-radius:11px;padding:10px 13px;font-size:12.5px;color:#6B5320;line-height:1.6}
.agewarn b{color:#4A3810}
.needbar{margin-top:10px;background:#EEF1FA;border:1.5px solid #C9D2EA;border-radius:11px;padding:10px 13px;font-size:12.5px;color:var(--navy);line-height:1.6}
.needbar b{font-weight:700}
.needbar.warn{background:#FDF3DC;border-color:#E8D9A8;color:#6B5320}
.needbar.ok{background:#E8F3EC;border-color:#B7DCC6;color:#1F5C3C}
.notice{background:#FDF7E8;border:1.5px solid #E8D9A8;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#6B5320;line-height:1.65}
.notice b{color:#4A3810}
.notice .oa{display:inline-block;margin-top:9px;padding:9px 16px;background:#06C755;color:#fff;border-radius:9px;font-size:13.5px;font-weight:700;text-decoration:none}
.dur{background:#EEF1FA;border:1.5px solid #C9D2EA;border-radius:11px;padding:11px 13px;margin-bottom:13px;font-size:13px;color:var(--navy);line-height:1.6}
.kidsrow{display:none;align-items:center;gap:11px;margin-top:10px;padding-top:10px;border-top:1px dashed #C9CFDF}
.kidsrow.on{display:flex}
.kidsrow span{font-size:13px;color:var(--ink-soft)}
.dopt{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-family:inherit;font-size:14.5px;text-align:left}
.dopt.on{border-color:var(--navy);background:var(--sel)}
.dopt b{color:var(--navy)}
.dopt .dsub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.dopt .dtag{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--navy);margin-left:10px}
.acct{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:16px;font-size:14.5px;line-height:1.9;color:var(--navy);text-align:left;white-space:pre-line}
.paybtn{display:block;margin:18px auto 0;padding:14px 26px;background:#06C755;color:#fff;border-radius:12px;font-size:16px;font-weight:700;text-decoration:none;max-width:280px}
.done{padding:56px 26px;text-align:center}
.done .big{font-size:44px}
.done h2{font-size:19px;color:var(--navy);margin:12px 0 8px}
.done p{font-size:14px;color:var(--ink-soft);line-height:1.7}
#balBar{padding:12px 18px 0}
.balcard{background:#F4F7FD;border:1px solid #C9D6EE;border-radius:10px;padding:11px 14px;font-size:13.5px;color:var(--navy)}
.balcard b{font-size:16px}
.baltag{display:inline-block;background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;margin-right:8px;vertical-align:1px}
.balnote{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.done .pendtag{display:inline-block;background:#FDF3DC;color:#8A6400;font-size:13px;font-weight:700;padding:6px 14px;border-radius:99px;margin-bottom:10px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1.5px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.bar .sum{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);margin-bottom:9px}
.bar .sum b{color:var(--navy);font-size:15px}
.bar .sum .clear{color:var(--ink-soft);text-decoration:underline;background:none;border:none;font-size:13px}
.btnrow{display:flex;gap:9px}
.back{flex:0 0 52px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;font-size:18px}
.next{flex:1;padding:14px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:16.5px;font-weight:700;letter-spacing:2px;font-family:inherit}
.next:disabled{background:#B8BCC7}

/* ══ 分岔畫面 / 我的點數 ══ */
.hm{padding:22px 18px 40px}
.hm-hi{font-size:20px;font-weight:700;color:var(--navy);margin:4px 0 20px}
.hm-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:20px 18px;margin-bottom:13px;border:1.5px solid #E3E6EC;border-radius:16px;
  background:#fff;cursor:pointer;font-family:inherit;transition:.15s}
.hm-card:hover{border-color:#9FB0CE;background:#F8FAFD}
.hm-card:active{transform:scale(.985)}
.hm-card.main{background:var(--navy);border-color:var(--navy)}
.hm-card.main .hm-tx b{color:#fff}
.hm-card.main .hm-tx small{color:#C3CCDF}
.hm-card.main .hm-ar{color:#8fa0c4}
.hm-ic{font-size:26px;flex:0 0 auto;line-height:1}
.hm-tx{flex:1;display:flex;flex-direction:column;gap:3px}
.hm-tx b{font-size:16.5px;color:var(--navy);font-weight:700}
.hm-tx small{font-size:12.5px;color:#8A90A0;line-height:1.5}
.hm-ar{font-size:22px;color:#C3CCDF;flex:0 0 auto}
.hm-note{margin-top:18px;font-size:12.5px;color:#A8AEBC;line-height:1.75}
.lnk{display:block;width:100%;margin-top:20px;padding:12px;border:0;background:none;
  color:#8A90A0;font-size:14px;font-family:inherit;cursor:pointer}
.lnk:hover{color:var(--navy)}
.mn-name{font-size:21px;font-weight:700;color:var(--navy);margin:4px 0 16px}
.mn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.mn-box{background:#fff;border:1px solid #E3E6EC;border-radius:14px;padding:16px 10px;text-align:center}
.mn-box b{display:block;font-size:26px;color:var(--navy);line-height:1.2}
.mn-box span{display:block;font-size:13px;color:#5B6272;margin-top:4px}
.mn-box small{display:block;font-size:10.5px;color:#A8AEBC;margin-top:2px}
.mn-zero{background:#fff;border:1px solid #E3E6EC;border-radius:14px;padding:22px 16px;
  text-align:center;font-size:14px;color:#5B6272;line-height:1.8}
.mn-h{margin:26px 0 10px;font-size:13px;font-weight:600;color:#8A90A0}
.mn-lg{background:#fff;border:1px solid #E3E6EC;border-radius:14px;overflow:hidden}
.mn-lgload{padding:22px 16px;text-align:center;font-size:13.5px;color:#A8AEBC}
.mn-lgrow{display:flex;align-items:center;gap:10px;padding:13px 15px;border-top:1px solid #F0F2F6;font-size:13.5px}
.mn-lgrow:first-child{border-top:0}
.mn-lgrow .dt{color:#A8AEBC;flex:0 0 44px;font-size:12.5px}
.mn-lgrow .rs{flex:1;color:#232936}
.mn-lgrow .dl{font-weight:600;white-space:nowrap}
.mn-lgrow .dl i{font-style:normal;font-size:11px;font-weight:400;color:#A8AEBC;margin-left:3px}
.mn-lgrow .minus{color:#C0392B}
.mn-lgrow .plus{color:#12805C}
.mn-empty{background:#fff;border:1px solid #E3E6EC;border-radius:16px;padding:28px 20px;text-align:center}
.mn-eic{font-size:34px;margin-bottom:10px}
.mn-empty b{display:block;font-size:16px;color:var(--navy);margin-bottom:8px}
.mn-empty small{display:block;font-size:13px;color:#8A90A0;line-height:1.8;margin-bottom:18px}
.mn-empty input{width:100%;padding:14px;border:1px solid #E3E6EC;border-radius:11px;
  font-size:16px;font-family:inherit;text-align:center;margin-bottom:12px;background:#FBFCFD}
.mn-empty input:focus{outline:0;border-color:#9FB0CE;background:#fff}
.mn-btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--navy);
  color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
.mn-btn:hover{background:#16223F}
.mn-btn:active{transform:scale(.985)}
.mn-err{margin-top:12px;font-size:13px;color:#C0392B;line-height:1.6}
</style>
</head>
<body>

const SHEET_HEADERS={
  "課程":["分類","課程名稱","說明","規格","時長","價格","圖片網址","上架","排序","最小年齡","可加堂"],

};
async function gviz(sheet){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheet)}&tqx=out:json`;
  let lastErr;
  /* 主通道：Google gviz */
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error("Google 回應 HTTP "+res.status);
    const t=await res.text();
    const a=t.indexOf("{"),b=t.lastIndexOf("}");
    if(a<0||b<0)throw new Error("回應不是資料格式");
    const j=JSON.parse(t.substring(a,b+1));
    if(!j.table)throw new Error("找不到工作表「"+sheet+"」");
    return j.table.rows.map(r=>r.c.map(c=>c?(c.f??c.v):""));
  }catch(e){lastErr=e}
  /* 備援通道 A：opensheet 代理 */
  try{
    const res2=await fetch(`https://opensheet.elte.hu/${SHEET_ID}/${encodeURIComponent(sheet)}`);
    if(res2.ok){
      const arr=await res2.json();
      const hs=SHEET_HEADERS[sheet]||[];
      if(Array.isArray(arr)&&arr.length)return arr.map(o=>hs.map(h=>o[h]??""));
    }
    lastErr=lastErr||new Error("備援A無資料");
  }catch(e2){lastErr=lastErr||e2}
  /* 備援通道 B：CORS 代理轉發 gviz */
  try{
    const prox="https://api.allorigins.win/raw?url="+encodeURIComponent(url);
    const res3=await fetch(prox);
    if(!res3.ok)throw new Error("備援B HTTP "+res3.status);
    const t3=await res3.text();
    const a3=t3.indexOf("{"),b3=t3.lastIndexOf("}");
    if(a3<0)throw new Error("備援B回應異常");
    const j3=JSON.parse(t3.substring(a3,b3+1));
    if(!j3.table)throw new Error("備援B找不到工作表");
    return j3.table.rows.map(r=>r.c.map(c=>c?(c.f??c.v):""));
  }catch(e3){
    throw new Error(`「${sheet}」讀取失敗｜主:${lastErr?lastErr.message:"?"}｜備B:${e3.message}`);
  }
}

let catOrder=[];
function rowsToGroups(rows){
  catOrder=[];
  const items=rows.map(r=>({cat:String(r[0]||"").trim(),name:String(r[1]||"").trim(),desc:String(r[2]||"").trim(),spec:String(r[3]||"").trim(),dur:String(r[4]||"").trim(),priceRaw:String(r[5]??"").trim(),img:String(r[6]||"").trim(),on:String(r[7]||"Y").trim().toUpperCase()!=="N",sort:+r[8]||99,minAge:+r[9]||0,multi:String(r[10]||"").trim().toUpperCase()==="Y"})).filter(c=>c.name&&c.on);
  const map=new Map();
  for(const it of items){
    if(!catOrder.includes(it.cat))catOrder.push(it.cat);
    const k=it.cat+"|"+it.name;
    if(!map.has(k)) map.set(k,{id:"g"+map.size,cat:it.cat,name:it.name,desc:it.desc,dur:it.dur,img:it.img,sort:it.sort,minAge:it.minAge,multiSession:it.multi,variants:[]});
    map.get(k).variants.push({spec:it.spec,priceRaw:it.priceRaw});
  }
  return [...map.values()].sort((a,b)=>a.sort-b.sort);
}
function rowsToAddons(rows){
  addonsByCourse={};
  rows.forEach(r=>{
    const cname=String(r[0]||"").trim(), aname=String(r[1]||"").trim();
    if(!cname||!aname)return;
    (addonsByCourse[cname]=addonsByCourse[cname]||[]).push({name:aname,price:pNum(r[2]),sort:+r[3]||99});
  });
  for(const k in addonsByCourse) addonsByCourse[k].sort((a,b)=>a.sort-b.sort);
}

/* ── 試算表暫存 ──
   Google 的 gviz 介面每次要一到兩秒，而原本是五份表依序去問，
   全部回來才畫畫面——客人就盯著一片空白等五次。
   存一份在手機裡，下次開直接用暫存畫出來，同時在背景跟試算表對，
   有變動再默默換掉。第二次之後幾乎不用等。 */
const SHEET_CACHE_KEY="otto2_liff_sheets_v2";
let sheetCache={};
try{ sheetCache=JSON.parse(localStorage.getItem(SHEET_CACHE_KEY)||"{}")||{} }catch(e){ sheetCache={} }
function cacheGet(sheet){
  const c=sheetCache[sheet];
  return (c&&Array.isArray(c.rows))?c.rows:null;
}
function cachePut(sheet,rows){
  try{
    sheetCache[sheet]={rows:rows,at:Date.now()};
    localStorage.setItem(SHEET_CACHE_KEY,JSON.stringify(sheetCache));
  }catch(e){/* 空間滿了或隱私模式，沒暫存也能跑 */}
}

function applyNotices(n){
  if(n.length&&String(n[0][0]).trim()==="類型")n=n.slice(1);
  const key=[],detail=[];
  n.forEach(r=>{
    const type=String(r[0]||"").trim();
    const title=String(r[1]||"").trim();
    const body=String(r[2]||"").trim();
    const sort=+r[3]||99;
    const on=String(r[4]||"Y").trim().toUpperCase()!=="N";
    if(!on||!body)return;
    (type.includes("重點")?key:detail).push({title,body,sort});
  });
  key.sort((a,b)=>a.sort-b.sort); detail.sort((a,b)=>a.sort-b.sort);
  if(key.length||detail.length)notices={key,detail};
}
function applyCopy(c){
  if(c.length&&String(c[0][0]).trim()==="代號")c=c.slice(1);

}
function applyAddons(a){
  if(a.length&&String(a[0][0]).trim()==="課程名稱")a=a.slice(1);
  rowsToAddons(a);
}

  try{ applyCourses(c) }catch(e){ return false }
  const pairs=[["訂金",applyDeposit],["說明",applyNotices],["文案",applyCopy],["加購",applyAddons]];
  pairs.forEach(([k,fn])=>{ const r=cacheGet(k); if(r){ try{ fn(r) }catch(e){} } });
  return true;
}

   慢一點沒關係，重點是不能擋住課程清單。 */
async function loadExtras(){
  if(!SHEET_ID)return;
  const jobs=[["訂金",applyDeposit],["說明",applyNotices],["文案",applyCopy],["加購",applyAddons]];
  await Promise.all(jobs.map(async ([sheet,fn])=>{
    try{
      const rows=await gviz(sheet);
      cachePut(sheet,rows);
      fn(rows);
    }catch(e){/* 少一份表也能正常預約，用預設值 */}
  }));
}

function teachersOn(d){
  if(schedule[d]!==undefined)return schedule[d];
  const [y,m,dd]=d.split("/").map(Number);
  return BASE_WEEK[new Date(y,m-1,dd).getDay()]??1;
}

/* 時段是否已過：日期在今天之前，或就是今天且時段開始時間已過 */
function slotPassed(d,slot){
  const now=new Date();
  const today=dstr(now.getFullYear(),now.getMonth()+1,now.getDate());
  if(d<today)return true;
  if(d>today)return false;
  const m=slot.match(/^(\d{1,2}):(\d{2})/);
  if(!m)return false;
  return now.getHours()*60+now.getMinutes() >= (+m[1])*60+(+m[2]);
}

const totalPeople=()=>Object.values(picks).reduce((s,p)=>s+p.qty,0);
const partyNeed=()=>adults+kids;
/* 本次預約需要幾個連續時段 */
/* 是否有課程本身時長超過一個時段（自動跨時段、不加價） */
const toMin=t=>{const m=String(t).match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:0};
const slotStart=sl=>toMin(sl.split("-")[0]);
const slotEnd=sl=>toMin((sl.split("-")[1]||"").trim());
const pad2=n=>String(n).padStart(2,"0");
const fmt=m=>`${pad2(Math.floor(m/60))}:${pad2(m%60)}`;
/* 回傳 {slots:[...], start:分鐘, end:分鐘, early:是否提早} 或 null（排不下） */
function planFor(startIdx){
  const sl=SLOTS[startIdx];
  if(hasTwoSessions()){
    if(!SLOTS[startIdx+1])return null;
    return {slots:[sl,SLOTS[startIdx+1]],start:slotStart(sl),end:slotEnd(SLOTS[startIdx+1]),early:0};
  }
  const mins=totalMinutes()||SLOT_MINUTES;
  const base=slotStart(sl);
  const myEnd=slotEnd(sl);
  const nextStart=SLOTS[startIdx+1]?slotStart(SLOTS[startIdx+1]):Infinity;
  const prevEnd=startIdx>0?slotEnd(SLOTS[startIdx-1]):toMin(OPEN_TIME);
  const limit=toMin(CLOSE_TIME);

  /* 決定開始時間：能提早就提早（最多 MAX_EARLY 分鐘），
     但不能早於開館、也不能撞到前一個時段的課 */
  let start=base;
  if(base+mins>myEnd&&EARLY_START){
    const want=Math.min(MAX_EARLY,base+mins-myEnd);
    const early=Math.max(base-want,prevEnd,toMin(OPEN_TIME));
    if(early<base)start=early;
  }
  const end=start+mins;
  if(end>limit)return null;                       // 超過最晚結束時間

  /* 結束時間若壓到後面的時段，那些時段一併佔用名額 */
  const list=[sl];
  let i=startIdx+1;
  while(SLOTS[i]&&end>slotStart(SLOTS[i])){list.push(SLOTS[i]);i++}
  return {slots:list,start,end,early:base-start};
}
function occupiedSlots(startIdx){const p=planFor(startIdx);return p?p.slots:null}
function hasLongCourse(){
  for(const id in picks){
    const g=groups.find(x=>x.id===id);
    if(g&&durMinutes(g.dur)>SLOT_MINUTES)return true;
  }
  return false;
}
/* 是否有人選了兩堂課（加價） */
const hasTwoSessions=()=>Object.values(picks).some(p=>p.sessions===2);
/* 本次預約需要幾個連續時段 */
const needSlots=()=>(hasTwoSessions()||hasLongCourse())?2:1;
/* 從課程「時長」欄解析分鐘數，取該組合的最大值（同時進行，非累加） */
function durMinutes(txt){
  const t=String(txt||"");
  const h=t.match(/(\d+(?:\.\d+)?)\s*小時/);
  const m=t.match(/(\d+)\s*分/);
  let mins=0;
  if(h)mins+=parseFloat(h[1])*60;
  if(m)mins+=parseInt(m[1]);
  if(!mins){const r=t.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)/);if(r)mins=parseFloat(r[2])*60}
  return mins;
}
function totalMinutes(){
  let max=0;
  for(const id in picks){
    const g=groups.find(x=>x.id===id);
    if(g)max=Math.max(max,durMinutes(g.dur));
  }
  return max;
}
function pickPrice(id){
  const g=groups.find(x=>x.id===id),p=picks[id];
  let sum=pNum(g.variants[p.variantIdx].priceRaw)*p.qty*(p.sessions===2?2:1);
  const ads=addonsByCourse[g.name]||[];
  for(const i in p.addons) if(p.addons[i]&&ads[i]) sum+=ads[i].price;
  return sum;
}

      共 <b>${need} 位</b>${ageTxt}，請為每位選擇課程（可選不同課程）。
      ${now?(now===need?`　已選滿 ✓`:`　已選 <b>${now}</b>，還差 ${need-now} 位`):''}
    </div>
  </div>
  <nav class="tabs" id="tabs">${cats.map(c=>`<button class="tab ${c===activeCat?'on':''}" data-cat="${c}">${c}</button>`).join("")}</nav><main class="list" id="list"></main>`;
  v.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;render()});
  const list=v.querySelector("#list");
  const show=groups.filter(g=>g.cat===activeCat);
  list.innerHTML=show.map(g=>{
    const p=picks[g.id],multi=g.variants.length>1,ads=addonsByCourse[g.name]||[];
    const elig=eligibleFor(g.minAge);
    const locked = !!g.minAge && elig===0;
    const capped = !!g.minAge && elig>0 && elig<partyNeed();
    return `<div class="card ${p?'sel':''} ${locked?'locked':''}" data-id="${g.id}" data-locked="${locked?1:''}" data-elig="${elig}">
      <div class="pic" ${g.img?`style="background-image:url('${g.img}')"`:''}>${g.img?'':'★'}</div>
      <div class="body">
        <h3>${g.name}${g.minAge?`<span class="agetag">${g.minAge>=16?"16歲以上":g.minAge+"歲以上"}</span>`:''}</h3>
        ${locked?`<div class="desc" style="color:var(--warn)">這次同行的人都未達這門課的年齡限制</div>`:''}
        ${capped?`<div class="desc" style="color:var(--warn)">這次只有 ${elig} 位符合年齡，最多選 ${elig} 份</div>`:''}
        ${g.desc?`<div class="desc">${g.desc}</div>`:''}
        <div class="meta">${g.dur?`<span class="chip">⏱ ${g.dur}</span>`:''}<span class="chip price">${priceChip(g)}</span></div>
        ${multi?`<div class="vars"><div class="vtitle">選擇規格</div><div class="vrow">${g.variants.map((vv,i)=>{
          const isTrial=/體驗/.test(vv.spec), isMember=/會員/.test(vv.spec);
          const blockTrial=isTrial&&visitCount>0;
          const blockMember=isMember&&!hasPlan&&visitCount>0;
          return `<button class="vopt ${p&&p.variantIdx===i?'on':''} ${blockTrial?'blocked':''}" data-v="${i}" ${blockTrial?'data-block="trial"':''}>${vv.spec||('款式'+(i+1))}　${pLabel(vv.priceRaw)}${blockTrial?' 🔒':''}</button>`;
        }).join("")}</div>${visitCount>0?`<div class="vnote">你已在本工作室上過課，體驗價僅限首次。若已購買方案，選擇會員價即可，現場核對。</div>`:''}</div>`:''}
        ${ads.length?`<div class="addons"><div class="vtitle">加購（可複選）</div>${ads.map((a,i)=>`<button class="aopt ${p&&p.addons&&p.addons[i]?'on':''}" data-a="${i}"><span class="aname"><span class="abox">✓</span>${a.name}</span><span class="ap">＋NT$${a.price.toLocaleString()}</span></button>`).join("")}</div>`:''}
        <div class="qty"><span>這門課幾位？</span><div class="stepper"><button data-act="minus">−</button><b>${p?p.qty:1}</b><button data-act="plus">＋</button></div></div>
        ${g.multiSession?`<div class="sess"><span>想上幾堂課？</span><div class="srow">
          <button class="sopt ${(!p||p.sessions!==2)?'on':''}" data-s="1">1 堂<small>一件作品</small></button>
          <button class="sopt ${p&&p.sessions===2?'on':''}" data-s="2">2 堂<small>費用 ×2</small></button>
        </div></div>`:''}
        ${durMinutes(g.dur)>SLOT_MINUTES?`<div class="longnote">此課程創作時間約 ${Math.round(durMinutes(g.dur)/60*10)/10} 小時，選時段時會顯示實際上課時間，請預留完整時間。</div>`:''}
      </div><div class="tick">✓</div></div>`;
  }).join("")||`<div class="state">這個分類目前沒有上架課程。</div>`;
  list.querySelectorAll(".card").forEach(el=>{
    const id=el.dataset.id;
    const elig=+el.dataset.elig||0;
    el.onclick=e=>{
      if(el.dataset.locked){alert("這門課有年齡限制，這次同行的人都還沒達到。可以看看其他分類的課程。");return}
      let t=e.target;
      while(t&&t!==el&&t.dataset.v===undefined&&t.dataset.a===undefined&&t.dataset.s===undefined&&!t.dataset.act)t=t.parentElement;
      if(t&&t.dataset.v!==undefined){
        if(t.dataset.block==="trial"){alert("體驗價僅限首次上課。你已在本工作室上過課，請選擇會員價或單次原價。");return}
        if(!picks[id])picks[id]={variantIdx:+t.dataset.v,qty:1,addons:{},sessions:1};
        else picks[id].variantIdx=+t.dataset.v;
        render();return}
      if(t&&t.dataset.s!==undefined){
        if(!picks[id])picks[id]={variantIdx:0,qty:1,addons:{},sessions:+t.dataset.s};
        else picks[id].sessions=+t.dataset.s;
        selSlot=""; render(); return}
      if(t&&t.dataset.a!==undefined){
        if(!picks[id])picks[id]={variantIdx:0,qty:1,addons:{},sessions:1};
        picks[id].addons=picks[id].addons||{};
        picks[id].addons[t.dataset.a]=!picks[id].addons[t.dataset.a];
        render();return}
      if(t&&t.dataset.act){
        const p=picks[id];if(!p)return;
        if(t.dataset.act==="plus"){
          if(p.qty>=elig){alert("這門課這次只有 "+elig+" 位符合年齡。");return}
          if(totalPeople()<partyNeed())p.qty++;
        }
        if(t.dataset.act==="minus")p.qty>1?p.qty--:delete picks[id];
        render();return}
      if(picks[id])delete picks[id];
      else if(totalPeople()<partyNeed())picks[id]={variantIdx:0,qty:1,addons:{},sessions:1};
      else alert(`你選的是 ${partyNeed()} 位，課程份數已經選滿了。要調整人數請回到最上方。`);
      render();
    };
  });
}
function renderCalendar(){
  const now=new Date();
  if(!calY){calY=now.getFullYear();calM=now.getMonth()+1}
  const first=new Date(calY,calM-1,1);
  const days=new Date(calY,calM,0).getDate();
  const startW=(first.getDay()+6)%7;
  const today=dstr(now.getFullYear(),now.getMonth()+1,now.getDate());
  let cells=`${["一","二","三","四","五","六","日"].map(w=>`<div class="wd">${w}</div>`).join("")}`;
  for(let i=0;i<startW;i++)cells+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const ds=dstr(calY,calM,d);
    const past=SLOTS.every(s=>slotPassed(ds,s));
    const anyLeft=SLOTS.some(s=>!slotPassed(ds,s)&&leftOf(ds,s)>=totalPeople());
    const dis=past||teachersOn(ds)===0||!anyLeft;
    cells+=`<button class="day ${dis?'off':'avail'} ${ds===selDate?'on':''}" data-d="${ds}" ${dis?'disabled':''}>${d}</button>`;
  }
  let slotHtml="";
  if(selDate){
    const now=new Date();
    const todayStr=dstr(now.getFullYear(),now.getMonth()+1,now.getDate());
    const isToday=selDate===todayStr;
    const isSat=new Date(...selDate.split("/").map((x,i)=>i===1?+x-1:+x)).getDay()===6;

    /* 當日／週六提示 */
    let noticeHtml="";
    if(isToday||isSat){
      noticeHtml=`<div class="notice">
        <b>${isToday?"當日預約":"週六與寒暑假"}提醒</b><br>
        ${isToday
          ? "當天的課程無法直接線上預約。想確認今天是否還有位置，請直接私訊小編為你安排。"
          : "週六與寒暑假期間較熱門，若想預約當日課程，請先私訊小編確認候補位置。"}
        <br><a class="oa" href="${LINE_OA_URL}" target="_blank">私訊小編詢問</a>
      </div>`;
    }

    /* 兩堂課提醒：總時長超過一個時段 */
    let durHtml="";

    slotHtml=`<div class="slots">${noticeHtml}
      ${hasTwoSessions()?`<div class="dur">你選了 <b>2 堂課</b>，需要<b>連續兩個時段</b>。<br>請選擇起始時段，系統會自動保留下一個時段。</div>`
        :(totalMinutes()>SLOT_MINUTES?`<div class="dur">你選的課程創作時間約 <b>${Math.round(totalMinutes()/60*10)/10} 小時</b>。<br>下方顯示的是<b>實際上課時間</b>，已為你安排足夠時段，請準時到館。<br>超過結束時間仍未完成，需<b>另計加時費用</b>。</div>`:'')}
      <h3>${selDate} 可預約時段（本組 ${totalPeople()} 位）</h3><div class="slotrow">${
      SLOTS.map((sl,i)=>{
        const plan=planFor(i);
        const noRoom=!plan;
        const occ=plan?plan.slots:[sl];
        const passed=!noRoom&&occ.some(x=>slotPassed(selDate,x));
        const left=noRoom?0:Math.min(...occ.map(x=>leftOf(selDate,x)));
        const full=!noRoom&&left<totalPeople();
        const dis=noRoom||passed||full||isToday;
        let capText;
        if(isToday)capText="當日請私訊小編";
        else if(noRoom)capText=hasTwoSessions()?"後面沒有可接續的時段":"時間不足，會超過打烊時間";
        else if(passed)capText="已過時間";
        else if(full)capText=left<=0?"已額滿":`僅剩 ${left} 位・人數不足`;
        else{
          const bits=[`剩 ${left} 位`];
          if(occ.length>1)bits.push("含後續時段");
          capText=bits.join("・");
        }
        const label=noRoom?sl:`${fmt(plan.start)}-${fmt(plan.end)}`;
        return `<button class="slot ${sl===selSlot?'on':''}" data-s="${sl}" ${dis?'disabled':''}>
          <span class="left">${label}</span>
          <span class="cap ${passed||isToday||noRoom?'':(left<=3?'low':'')}">${capText}</span></button>`;
      }).join("")}</div></div>`;
  }
  const v=document.getElementById("view");
  v.innerHTML=`<div class="calwrap">
    <div class="calhead"><button id="pm">‹</button><h2>${calY} 年 ${calM} 月</h2><button id="nm">›</button></div>
    <div class="grid">${cells}</div>${slotHtml}
  </div>`;
  v.querySelector("#pm").onclick=()=>{calM--;if(calM<1){calM=12;calY--}selDate="";selSlot="";render()};
  v.querySelector("#nm").onclick=()=>{calM++;if(calM>12){calM=1;calY++}selDate="";selSlot="";render()};
  v.querySelectorAll(".day.avail").forEach(b=>b.onclick=()=>{selDate=b.dataset.d;selSlot="";render()});
  v.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{selSlot=b.dataset.s;render()});
}
function pickSummary(id){
  const g=groups.find(x=>x.id===id),p=picks[id],vv=g.variants[p.variantIdx];
  const ads=addonsByCourse[g.name]||[];
  const chosen=Object.keys(p.addons||{}).filter(i=>p.addons[i]&&ads[i]).map(i=>ads[i].name);
  return `${g.name}${vv.spec?'（'+vv.spec+'）':''} × ${p.qty}位${chosen.length?'<br><span style="font-size:12.5px;color:var(--ink-soft)">加購：'+chosen.join("、")+'</span>':''}`;
}
function renderForm(){
  const items=Object.keys(picks).map(pickSummary).join("<br>");
  const v=document.getElementById("view");
  v.innerHTML=`<div class="form">
    <div class="recap"><b>${selDate}　${timeLabel()}</b><br>${items}<br>共 ${totalPeople()} 位・合計 <b>NT$${totalPrice().toLocaleString()}</b></div>
    <div class="field"><label>姓名 *</label><input id="fName" value="${customer.name}" placeholder="請填寫聯絡人姓名"></div>
    <div class="field"><label>手機 *</label><input id="fPhone" value="${customer.phone}" inputmode="tel" placeholder="09xx-xxx-xxx"></div>
    <div class="field"><label>備註</label><textarea id="fNote" rows="3" placeholder="特殊需求、想做的圖案等">${customer.note}</textarea></div>
    <div class="field"><label>訂金方式 *</label><div class="dep">
      ${payOptions.map((o,i)=>`
      <button class="dopt ${deposit===String(i)?'on':''}" data-dep="${i}">
        <span><b>${o.name}</b><div class="dsub">${o.desc}</div></span>
        <span class="dtag">${o.amount?(o.type==="points"?o.amount+" 點":"NT$"+o.amount.toLocaleString()):"現場"}</span></button>`).join("")}
    </div></div>
  </div>`;
  v.querySelectorAll(".dopt").forEach(b=>b.onclick=()=>{deposit=b.dataset.dep;render()});
  ["fName","fPhone","fNote"].forEach(id=>{
    v.querySelector("#"+id).oninput=()=>{
      customer={name:v.querySelector("#fName").value,phone:v.querySelector("#fPhone").value,note:v.querySelector("#fNote").value};
      updateBar();
      if(id==="fPhone")lookupMemberByPhone(customer.phone);
    };
  });
}
function renderDone(id){
  document.getElementById("bar").style.display="none";
  const o=payOptions[+deposit]||{};
  let payHtml="";
  if(o.type==="linepay"&&o.info)
    payHtml=`<a class="paybtn" href="${o.info}" target="_blank">前往 LINE Pay 付訂金 NT$${o.amount}</a>
      <p style="margin-top:12px">付款完成後請<b>截圖回傳 LINE</b>，<br>小編確認訂金後預約才算保留成功。</p>`;
  else if(o.type==="transfer")
    payHtml=`<div class="acct">${(o.info||"匯款資訊請洽小編").replace(/\n/g,"<br>")}</div>
      <p style="margin-top:12px">請轉帳 <b>NT$${o.amount}</b>，完成後將<b>帳號末五碼回傳 LINE</b>，<br>小編確認後預約才算保留成功。</p>`;
  else if(o.type==="points")
    payHtml=`<p style="margin-top:12px">我們將為你<b>預扣 ${o.amount} 點</b>作為訂金，<br>小編確認點數後會透過 LINE 回覆你。</p>`;
  else
    payHtml=`<p style="margin-top:12px">${o.desc||"小編會透過 LINE 與你確認付款方式。"}</p>`;
  const onSite=o.type==="card";
  const head=onSite
    ? `<h2>預約完成！</h2>`
    : `<h2>預約已送出</h2><div class="pendtag">尚未完成訂金 · 位子暫留中</div>`;
  document.getElementById("view").innerHTML=`<div class="done">
    <div class="big">★</div>${head}
    <p><b>${selDate}　${timeLabel()}</b><br>共 ${totalPeople()} 位・NT$${totalPrice().toLocaleString()}<br>
    ${FIREBASE_URL?'':'（示範模式，未實際寫入）'}編號：${id}</p>
    ${payHtml}</div>`;
}
function planNow(){
  const i=SLOTS.indexOf(selSlot);
  return i<0?null:planFor(i);
}
function occupiedNow(){const p=planNow();return p?p.slots:[selSlot]}
function timeLabel(){
  const p=planNow();
  return p?`${fmt(p.start)}-${fmt(p.end)}`:selSlot;
}
function pairSlot(){const o=occupiedNow();return o.length>1?o[1]:null}
async function submitBooking(){
  if(slotPassed(selDate,selSlot)){
    alert("這個時段已經開始了，請重新選擇時間。");setStep(3);selSlot="";return;
  }
  await loadBookings();
  const occ=occupiedNow(), p2=pairSlot();
  if(occ.some(x=>leftOf(selDate,x)<totalPeople())){
    alert("這個時段名額剛被約走，請重新選時段。");setStep(3);return;
  }
  const rec={
    date:selDate, slot:selSlot, slot2:p2||null,
    sessions:hasTwoSessions()?2:1,
    spanSlots:occ.length,
    actualTime:timeLabel(),
    earlyArrival:(planNow()&&planNow().early>0)?fmt(planNow().start):null,
    spanReason:hasTwoSessions()?"兩堂課":(occ.length>1?"課程時長較長":""),
    items:Object.keys(picks).map(id=>{
      const g=groups.find(x=>x.id===id),p=picks[id],vv=g.variants[p.variantIdx];
      const ads=addonsByCourse[g.name]||[];
      return{name:g.name,spec:vv.spec,qty:p.qty,price:pNum(vv.priceRaw),
        addons:Object.keys(p.addons||{}).filter(i=>p.addons[i]&&ads[i]).map(i=>({name:ads[i].name,price:ads[i].price}))};
    }),
    people:totalPeople(), total:totalPrice(),
    customer:{...customer},
    /* 現場刷卡不需預付；其餘一律 unpaid，收到訂金才轉 confirmed */
    status:((payOptions[+deposit]||{}).type==="card")?"new":"unpaid",
    party:{adults, kids, kidAges:kidAges.slice(0,kids),
      kidBands:kidAges.slice(0,kids).map(bandLabel),
      label:`大人 ${adults} 位${kids?" ・ 兒童 "+kids+" 位（"+kidAges.slice(0,kids).filter(a=>a).map(bandLabel).join("、")+"）":""}`},
    adults:adults, kids:kids,
    durationMin:totalMinutes(),
    visitCount, hasPlan,
    deposit:(()=>{const o=payOptions[+deposit]||{};return{method:o.type||"other",name:o.name||"",amount:o.amount||0,status:"pending"}})(),
    line:lineUser?{userId:lineUser.userId,displayName:lineUser.displayName}:null,
    source:"web", ts:new Date().toISOString()
  };
  let id="DEMO-"+Math.random().toString(36).slice(2,7).toUpperCase();
  if(FIREBASE_URL){
    const res=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/bookings.json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)});
    const j=await res.json(); id=j.name?j.name.slice(-6).toUpperCase():id;
  }else DEMO_BOOKINGS.push(rec);
  if(NOTIFY_URL&&lineUser){
    fetch(NOTIFY_URL.replace(/\/$/,"")+"/notify/booking",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)}).catch(()=>{});
  }
  if(FIREBASE_URL&&lineUser){
    fetch(FIREBASE_URL.replace(/\/$/,"")+"/liffProfiles/"+lineUser.userId+".json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:customer.name,phone:customer.phone,displayName:lineUser.displayName,lastBooking:rec.ts})}).catch(()=>{});
  }
  renderDone(id);
}
document.getElementById("btnClear").onclick=()=>{picks={};selDate="";selSlot="";adults=1;kids=0;kidAges=[];render()};
document.getElementById("btnBack").onclick=()=>setStep(step-1);
document.getElementById("btnNext").onclick=async()=>{
  if(step===1)setStep(2);
  else if(step===2){await loadSchedule();await loadBookings();setStep(3)}
  else if(step===3)setStep(4);
  else if(step===4){document.getElementById("btnNext").disabled=true;await submitBooking()}
};
window.addEventListener("error",function(ev){
  const v=document.getElementById("view");
  if(v&&v.innerHTML.length<60){
    v.innerHTML=`<div class="state">頁面載入時發生問題。<br><br>
      <span style="font-size:12px;color:#C0392B;word-break:break-all">${ev.message||"未知錯誤"}</span><br><br>
      <button onclick="location.reload()" style="padding:11px 26px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;font-size:15px;font-family:inherit">重新載入</button></div>`;
  }
});
/* 第一次開沒有暫存時，先放幾個灰塊。
   一片空白會讓人以為壞掉，灰塊至少看得出在載。 */
function showSkeleton(){
  const v=document.getElementById("view");
  if(!v||v.innerHTML.trim())return;
  let h='<div style="padding:16px 14px">';
  for(let i=0;i<4;i++)
    h+='<div class="sk-card"><div class="sk-line w60"></div><div class="sk-line w90"></div>'+
       '<div class="sk-line w40"></div></div>';
  h+='</div>';
  v.innerHTML=h;
}

function boot(){
  initLiff().catch(()=>{});   // 認人失敗不影響預約

  /* 有暫存就先畫出來，客人立刻看得到東西。
     背景再跟試算表對一次，有變動才重畫。 */
  let warm=false;
  try{ warm=loadFromCache() }catch(e){ warm=false }
  if(warm)render(); else showSkeleton();

  loadCourses().then(()=>{
    render();                       // 課程到了先畫，不等其餘四份表
    return loadExtras();
  }).then(()=>{
    render();                       // 訂金、加購那些回來了再補上
  }).catch(err=>{
    if(warm)return;                 // 連不上但有暫存，就繼續用暫存，不要跳錯誤
    document.getElementById("view").innerHTML=
      `<div class="state">讀不到課程表格。<br><br>
       <span style="font-size:12.5px;color:#C0392B;word-break:break-all">${err.message}</span><br><br>
       <button onclick="boot()" style="padding:11px 26px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;font-size:15px;font-family:inherit">重試</button></div>`;
  });
}
boot();
</script>
